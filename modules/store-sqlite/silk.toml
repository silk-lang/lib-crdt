[package]
name = "crdt-store-sqlite"
description = "A crdt-core Store kept in SQLite through lib-sqlite"
version = "0.1.0"
silk-version = "0.1.0-dev.86+c9d19330761b"
kind = "library"
exports = ["sqlite_store"]

[dependencies]
core = { path = "../core", package = "crdt-core" }
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "7fbab9dbfbb696097f2dbecc065e21b7204eb974", package = "db-sqlite" }
