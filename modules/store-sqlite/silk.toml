[package]
name = "crdt-store-sqlite"
description = "A crdt-core Store kept in SQLite through lib-sqlite"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
exports = ["sqlite_store"]

[dependencies]
core = { path = "../core", package = "crdt-core" }
sqlite = { git = "https://github.com/silk-lang/lib-sqlite", rev = "031d3ff6fc69f399b30547ef15f4a6dbf765d4bb", package = "db-sqlite" }
